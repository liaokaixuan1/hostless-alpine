build:
  system: docker
  dockerfile_path: "./Dockerfile"
  working_directory: "/"
  build_context_directory: "/"

# 镜像自带 CMD，start_command 留空即可
start_command: ""

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 128
  max_memory: 512
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 100

# darkhttpd 没有 CGI，健康检查用 TCP 探端口（HTTP 探活会让默认 / 之外的路由误判）
health_check:
  type: tcp
  interval_in_seconds: 10