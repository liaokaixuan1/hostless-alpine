build:
  system: docker
  dockerfile_path: "./Dockerfile"
  working_directory: "/"
  build_context_directory: "/"

# 镜像自带 CMD，start_command 留空即可
start_command: ""

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 128
  max_memory: 512
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 100

health_check:
  type: http
  http_path: "/cgi-bin/healthz"
  interval_in_seconds: 10

# 固定旧副本先停，避免两副本并存（免费池只有一个名额）